name: Quality
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
